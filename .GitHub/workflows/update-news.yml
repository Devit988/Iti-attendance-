name: Update Daily News

on:
  schedule:
    # Runs daily at 6:00 AM and 6:00 PM IST (00:30 & 12:30 UTC)
    - cron: "30 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest news
        run: node scripts/fetch-news.mjs

      - name: Commit news.json if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet news.json 2>/dev/null || [ ! -f .git/index ] || [ -n "$(git status --porcelain news.json)" ]; then
            git add news.json
            git commit -m "chore: update daily news"
            git push
          else
            echo "No news changes to commit."
          fi
