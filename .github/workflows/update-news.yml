name: Update Daily News

on:
  schedule:
    # Runs every 3 hours (at :00 UTC, so 5:30, 8:30, 11:30 ... IST)
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest news
        run: node scripts/fetch-news.mjs

      - name: Commit news.json if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain news.json)" ]; then
            git add news.json
            git commit -m "chore: update daily news"
            git pull --rebase
            git push
          else
            echo "No news changes to commit."
          fi
