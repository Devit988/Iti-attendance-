<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITI CONNECT — Under Maintenance</title>
  <style>
    /* Bright Mode styling matching ITI CONNECT light theme palette */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(60% 45% at 15% 10%, rgba(96, 165, 250, 0.18), transparent 70%),
        radial-gradient(50% 40% at 85% 90%, rgba(251, 146, 60, 0.16), transparent 70%),
        #f1f5f9;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }

    /* Main glass-bordered card */
    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 28px 32px;
      border-radius: 22px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      box-shadow: 0 14px 34px -10px rgba(15, 23, 42, 0.12);
      animation: cardEnter 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Soft glowing circular badge holding the animated maintenance icons */
    .icon-badge {
      position: relative;
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: linear-gradient(145deg, #fff7ed, #ffedd5);
      border: 1px solid #fed7aa;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 20px -6px rgba(232, 89, 12, 0.25);
    }

    /* Subtle ambient pulse ring around the badge */
    .icon-badge::after {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 26px;
      border: 1.5px solid rgba(232, 89, 12, 0.28);
      animation: badgePulse 2.6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes badgePulse {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.97);
      }
      50% {
        opacity: 0.9;
        transform: scale(1.04);
      }
    }

    /* SVG gear and wrench animations */
    .maint-svg {
      width: 44px;
      height: 44px;
      overflow: visible;
    }

    .gear-spin {
      transform-origin: 15px 15px;
      animation: spinGear 7s linear infinite;
    }

    .wrench-tilt {
      transform-origin: 31px 31px;
      animation: tiltWrench 2.4s ease-in-out infinite;
    }

    @keyframes spinGear {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes tiltWrench {
      0%, 100% {
        transform: rotate(-10deg);
      }
      50% {
        transform: rotate(14deg);
      }
    }

    /* Brand heading */
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #0f172a;
    }

    h1 span {
      color: #e8590c;
    }

    /* Status message */
    p {
      margin: 0 0 22px;
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
    }

    /* Subtle animated progress bar */
    .progress-track {
      width: 148px;
      height: 4px;
      margin: 0 auto;
      border-radius: 9999px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .progress-fill {
      width: 42%;
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #ff7a1a, #e8590c);
      animation: progressSlide 1.6s ease-in-out infinite;
    }

    @keyframes progressSlide {
      0% {
        transform: translateX(-110%);
      }
      100% {
        transform: translateX(260%);
      }
    }

    /* Respect user reduced-motion preferences */
    @media (prefers-reduced-motion: reduce) {
      .card,
      .icon-badge::after,
      .gear-spin,
      .wrench-tilt,
      .progress-fill {
        animation: none;
      }
      .progress-fill {
        width: 60%;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <!-- Animated Maintenance Badge (Rotating Gear + Tilting Wrench) -->
    <div class="icon-badge" aria-hidden="true">
      <svg class="maint-svg" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Rotating Gear (Top-Left) -->
        <g class="gear-spin">
          <circle cx="15" cy="15" r="5.2" stroke="#e8590c" stroke-width="2.4" fill="#fff7ed" />
          <circle cx="15" cy="15" r="1.8" fill="#ff7a1a" />
          <path
            d="M15 6.8V8.8M15 21.2V23.2M6.8 15H8.8M21.2 15H23.2M9.2 9.2L10.6 10.6M19.4 19.4L20.8 20.8M20.8 9.2L19.4 10.6M10.6 19.4L9.2 20.8"
            stroke="#e8590c"
            stroke-width="2.3"
            stroke-linecap="round"
          />
        </g>

        <!-- Tilting Wrench (Bottom-Right) -->
        <g class="wrench-tilt">
          <path
            d="M36.2 23.4a5.2 5.2 0 0 0-6.6 6.5l-6.8 6.8a2.1 2.1 0 0 0 3 3l6.8-6.8a5.2 5.2 0 0 0 6.5-6.6l-3.1 3.1-2.9-.7-.7-2.9 3.8-2.4Z"
            fill="#0f172a"
            stroke="#0f172a"
            stroke-width="1.2"
            stroke-linejoin="round"
          />
        </g>
      </svg>
    </div>

    <!-- Heading & Message -->
    <h1>ITI <span>CONNECT</span></h1>
    <p>We are currently performing scheduled maintenance and updates.<br />Please check back shortly.</p>

    <!-- Animated Progress Bar -->
    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill"></div>
    </div>
  </main>
</body>
</html>
